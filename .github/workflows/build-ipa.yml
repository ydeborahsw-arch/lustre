name: Build IPA
# Manual trigger only. Private values (server origin, bundle id, team id, auth, display names)
# live in repository secrets and are injected at build time; no build output is kept as an artifact.
on:
  workflow_dispatch:
    inputs:
      job:
        description: "testflight = signed build uploaded to TestFlight / check = compile only"
        required: false
        default: "testflight"
        type: choice
        options: [testflight, check]

env:
  LX_ORIGIN: ${{ secrets.LX_ORIGIN }}
  LX_BUNDLE: ${{ secrets.LX_BUNDLE }}
  LX_TEAM: ${{ secrets.LX_TEAM }}
  LX_AUTH: ${{ secrets.LX_AUTH }}
  LX_YAN: ${{ secrets.LX_YAN }}
  LX_ZHAO: ${{ secrets.LX_ZHAO }}
  LX_ZHAO2: ${{ secrets.LX_ZHAO2 }}
  LX_TITLE: ${{ secrets.LX_TITLE }}
  LX_FONT_URL: ${{ secrets.LX_FONT_URL }}

jobs:
  check:
    if: inputs.job == 'check'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Inject private values
        run: python3 .github/inject.py
      - name: Fetch licensed font (not stored in this repo)
        run: |
          echo "::add-mask::$LX_FONT_URL"
          curl -fsSL "$LX_FONT_URL" -o ios/App/App/AnthropicSans.ttf
      - name: Install deps & sync
        run: |
          npm ci || npm install
          npx cap sync ios
      - name: Compile (unsigned, no output kept)
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -archivePath $PWD/build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO archive

  testflight:
    if: inputs.job == 'testflight' || inputs.job == ''
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Inject private values
        run: python3 .github/inject.py
      - name: Fetch licensed font (not stored in this repo)
        run: |
          echo "::add-mask::$LX_FONT_URL"
          curl -fsSL "$LX_FONT_URL" -o ios/App/App/AnthropicSans.ttf
      - name: Lower the font's underline below the descenders
        run: |
          python3 -m venv /tmp/ft && /tmp/ft/bin/pip install -q fonttools
          /tmp/ft/bin/python - <<'EOF'
          from fontTools.ttLib import TTFont
          p = 'ios/App/App/AnthropicSans.ttf'
          f = TTFont(p)
          print('underline before', f['post'].underlinePosition, f['post'].underlineThickness)
          f['post'].underlinePosition = -700
          f.save(p)
          print('underline after', TTFont(p)['post'].underlinePosition)
          EOF
      - name: Install deps & sync
        run: |
          npm ci || npm install
          npx cap sync ios
      - name: Import signing assets
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.PROFILE_BASE64 }}
        run: |
          echo "$P12_BASE64" | base64 -d > dist.p12
          echo "$PROFILE_BASE64" | base64 -d > profile.mobileprovision
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security set-keychain-settings -t 3600 build.keychain
          security import dist.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci build.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<< "$(security cms -D -i profile.mobileprovision)")
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision
          rm -f dist.p12 profile.mobileprovision
      - name: Build signed archive
        run: |
          cd ios/App
          # Build numbers must keep increasing across all earlier pipelines.
          BUILD_NO=$((GITHUB_RUN_NUMBER + 3000))
          echo "build number: $BUILD_NO"
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -archivePath $PWD/build/App.xcarchive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$LX_TEAM" \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="Lustre AppStore" \
            CURRENT_PROJECT_VERSION=$BUILD_NO \
            archive
      - name: Export IPA
        run: |
          cd ios/App
          cat > exportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${LX_TEAM}</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict>
              <key>${LX_BUNDLE}</key><string>Lustre AppStore</string>
            </dict>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath $PWD/build/App.xcarchive \
            -exportPath $PWD/build/export -exportOptionsPlist exportOptions.plist
      - name: Send debug symbols to private inbox
        env:
          LX_SHOT_URL: ${{ secrets.LX_SHOT_URL }}
        run: |
          echo "::add-mask::$LX_SHOT_URL"
          cd ios/App/build/App.xcarchive
          zip -qr "$GITHUB_WORKSPACE/dsym-${GITHUB_RUN_NUMBER}.zip" dSYMs
          curl -fsS -F "file=@$GITHUB_WORKSPACE/dsym-${GITHUB_RUN_NUMBER}.zip" "$LX_SHOT_URL" > /dev/null || echo "symbol upload failed"
          rm -f "$GITHUB_WORKSPACE/dsym-${GITHUB_RUN_NUMBER}.zip"
      - name: Upload to TestFlight
        env:
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          mkdir -p ./private_keys
          echo "$ASC_KEY_BASE64" | base64 -d > ./private_keys/AuthKey_"$ASC_KEY_ID".p8
          xcrun altool --upload-app -f ios/App/build/export/*.ipa -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          rm -rf ./private_keys
